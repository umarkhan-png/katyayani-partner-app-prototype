<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Phase 2 — Katyayani Partner App</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; font-family:'Manrope', system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
  body{ background:#0a0a0a; color:#fff; margin:0; }
  a{ color:inherit; text-decoration:none; }

  header{ border-bottom:1px solid #1c1c1c; background:#0d0d0d; position:sticky; top:0; z-index:20; }
  .head{ max-width:1180px; margin:0 auto; padding:14px 18px; display:flex; align-items:center; gap:14px; }
  .logo{ width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; background:linear-gradient(135deg,#0E7A4E,#D4A537); }
  .head h1{ font-size:16px; font-weight:800; margin:0; letter-spacing:-.01em; }
  .head .sub{ font-size:11px; color:#7d7d7d; margin-top:1px; }
  .head-links{ margin-left:auto; display:flex; gap:8px; }
  .lnk{ border:1px solid #262626; background:#141414; padding:7px 12px; border-radius:8px; font-size:11.5px; font-weight:700; color:#cfcfcf; }
  .lnk:hover{ border-color:#0E7A4E; color:#fff; }
  .lnk.on{ background:#0E7A4E; border-color:#0E7A4E; color:#fff; }

  .shell{ max-width:1180px; margin:0 auto; padding:20px 18px 60px; display:grid; grid-template-columns:232px minmax(0,1fr); gap:22px; align-items:start; }

  /* feature rail */
  .rail{ position:sticky; top:70px; border:1px solid #1c1c1c; border-radius:12px; background:#101010; overflow:hidden; }
  .rail-h{ font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#6e6e6e; padding:12px 13px 8px; }
  .frow{ display:flex; align-items:center; gap:8px; width:100%; padding:8px 13px; background:none; border:none; border-left:2px solid transparent; cursor:pointer; text-align:left; color:#b6b6b6; font-size:12.5px; font-weight:600; }
  .frow:hover{ background:#161616; color:#fff; }
  .frow.on{ background:#13211a; border-left-color:#0E7A4E; color:#fff; }
  .frow .num{ font-size:10px; color:#5a5a5a; width:18px; flex-shrink:0; font-weight:700; }
  .frow.on .num{ color:#5FBF8E; }
  .dot{ width:6px; height:6px; border-radius:50%; margin-left:auto; flex-shrink:0; background:#3a3a3a; }
  .dot.ready{ background:#0E7A4E; } .dot.test{ background:#D4A537; }

  /* panel */
  .panel{ min-height:520px; }
  .p-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:3px; }
  .p-head h2{ font-size:20px; font-weight:800; margin:0; letter-spacing:-.01em; }
  .chip{ font-size:9px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; padding:3px 7px; border-radius:4px; background:#242424; color:#9a9a9a; }
  .chip.ready{ background:#0E7A4E; color:#fff; } .chip.test{ background:#D4A537; color:#1a1400; }
  .p-sub{ font-size:12.5px; color:#8d8d8d; margin:0 0 16px; line-height:1.6; max-width:80ch; }

  .stagewrap{ display:grid; grid-template-columns:300px minmax(0,1fr); gap:20px; align-items:start; }
  .phone{ width:300px; height:600px; border-radius:28px; background:#0a0a0a; box-shadow:0 0 0 2px #262626, 0 20px 50px rgba(0,0,0,.6); overflow:hidden; position:relative; }
  .phone iframe{ width:390px; height:780px; border:none; transform:scale(.769); transform-origin:top left; display:block; }

  .seg{ display:inline-flex; background:#141414; border:1px solid #242424; border-radius:9px; padding:3px; gap:3px; margin-bottom:12px; }
  .seg button{ background:none; border:none; color:#9a9a9a; font-size:11.5px; font-weight:700; padding:7px 12px; border-radius:7px; cursor:pointer; }
  .seg button.on{ background:#0E7A4E; color:#fff; }

  .steps{ display:flex; flex-direction:column; gap:5px; margin-bottom:14px; }
  .step{ display:flex; gap:9px; align-items:center; background:#111; border:1px solid #1e1e1e; border-radius:8px; padding:8px 11px; cursor:pointer; color:#a8a8a8; font-size:12px; font-weight:600; text-align:left; }
  .step:hover{ border-color:#333; color:#fff; }
  .step.on{ background:#13211a; border-color:#0E7A4E; color:#fff; }
  .step .n{ font-size:10px; font-weight:800; color:#5FBF8E; width:14px; }
  .step small{ display:block; font-size:10.5px; font-weight:500; color:#6e6e6e; margin-top:1px; }
  .step.on small{ color:#9fc9b2; }

  .tools{ display:flex; gap:8px; margin-bottom:16px; }
  .tool{ border:1px solid #262626; background:#141414; color:#c9c9c9; font-size:11px; font-weight:700; padding:6px 11px; border-radius:7px; cursor:pointer; }
  .tool:hover{ border-color:#0E7A4E; color:#fff; }

  .rules{ font-size:11.5px; color:#8d8d8d; line-height:1.65; border-top:1px solid #1c1c1c; padding-top:12px; }
  .rules b{ color:#d8d8d8; }

  .states-h{ font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#6e6e6e; margin:22px 0 10px; }
  .cards{ display:flex; gap:14px; overflow-x:auto; padding-bottom:8px; }
  .frame{ width:150px; height:300px; border-radius:18px; background:#0a0a0a; overflow:hidden; position:relative; box-shadow:0 0 0 2px #242424; transition:transform .18s, box-shadow .18s; flex-shrink:0; }
  .frame:hover{ transform:translateY(-4px); box-shadow:0 0 0 2px #2f2f2f, 0 16px 36px rgba(14,122,78,.35); }
  .frame iframe{ width:390px; height:780px; border:none; transform:scale(.3846); transform-origin:top left; display:block; pointer-events:none; }
  .cap{ font-size:11px; font-weight:700; margin-top:7px; text-align:center; }
  .cap small{ display:block; font-size:9.5px; font-weight:500; color:#5FBF8E; margin-top:2px; }

  .empty{ border:1px dashed #262626; border-radius:12px; padding:34px 22px; text-align:center; color:#7d7d7d; }
  .empty .t{ font-size:14px; font-weight:700; color:#d0d0d0; }
  .empty .d{ font-size:12px; margin-top:6px; line-height:1.6; }
  .empty a{ color:#5FBF8E; font-weight:700; }

  @media (max-width:900px){
    .shell{ grid-template-columns:1fr; }
    .rail{ position:static; }
    .stagewrap{ grid-template-columns:1fr; }
    .phone{ width:100%; max-width:300px; margin:0 auto; }
  }
</style>
</head>
<body>

<header>
  <div class="head">
    <div class="logo">K</div>
    <div>
      <h1>Phase 2 · Partner App</h1>
      <div class="sub">4 features in scope · screens, flows and states</div>
    </div>
    <div class="head-links">
      <a class="lnk" href="docs/phase-2.html">Document</a>
      <a class="lnk" href="docs/phase-2-deferred.html">Deferred</a>
      <a class="lnk" href="index.html">Full prototype</a>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="rail">
    <div id="rail"></div>
  </nav>

  <main class="panel" id="panel"></main>
</div>

<script>
/* ------------------------------------------------------------------
   Phase 2 index. Add a feature by adding an entry here — flows[] and
   states[] are optional, so a feature can sit in the list before its
   screens exist.
------------------------------------------------------------------- */
var FEATURES = [
  { id:'f1', n:'1', scope:'later', name:'Supporting ID OTP', status:'ready',
    sub:'Enter the ID inside the app, verify by OTP where the provider supports it, confirm what came back. Upload stays as the fallback.',
    flows:[
      { key:'aadhaar', label:'Aadhaar · OTP',
        steps:[
          ['Documents','Supporting ID hub','screens/rapido-documents.html'],
          ['Enter Aadhaar','12 digits + consent','screens/kyc-id-otp.html?id=aadhaar'],
          ['OTP','6 digits, 10 min, resend','screens/kyc-id-otp.html?id=aadhaar&state=otp'],
          ['Confirm details','Name match before saving','screens/kyc-id-otp.html?id=aadhaar&state=details'],
          ['Verified','Pricing unlocked','screens/kyc-id-otp.html?id=aadhaar&state=verified']
        ]},
      { key:'lookup', label:'PAN / GST · lookup',
        steps:[
          ['Enter PAN','No OTP — NSDL lookup','screens/kyc-id-otp.html?id=pan'],
          ['Confirm details','Name on PAN','screens/kyc-id-otp.html?id=pan&state=details'],
          ['GST fetched','Trade name, legal name, status','screens/kyc-id-otp.html?id=gst&state=details'],
          ['Verified','Saved to KYC','screens/kyc-id-otp.html?id=gst&state=verified']
        ]}
    ],
    states:[
      ['screens/kyc-id-otp.html?id=aadhaar','Enter ID','consent named'],
      ['screens/kyc-id-otp.html?id=aadhaar&state=otp','OTP','timer + resend'],
      ['screens/kyc-id-otp.html?id=aadhaar&state=otp-wrong','Wrong OTP','attempts left'],
      ['screens/kyc-id-otp.html?id=aadhaar&state=otp-locked','Locked','upload instead'],
      ['screens/kyc-id-otp.html?id=aadhaar&state=details','Fetched','name match'],
      ['screens/kyc-id-otp.html?id=aadhaar&state=mismatch','Mismatch','goes to review'],
      ['screens/kyc-id-otp.html?id=aadhaar&state=verified','Verified','what it unlocked'],
      ['screens/kyc-id-otp.html?id=aadhaar&state=pending','Under review','1–2 days'],
      ['screens/kyc-id-otp.html?id=aadhaar&state=duplicate','Already used','support path'],
      ['screens/kyc-id-otp.html?id=pan&state=provider-down','Provider down','retry, nothing sent']
    ],
    rules:'<b>OTP only where the provider supports it</b> — Aadhaar yes, PAN and GST are lookups, so no fake OTP screen. ' +
          '<b>Nothing saves</b> until the retailer sees what came back. <b>Aadhaar masked</b> to last 4 everywhere. ' +
          '<b>Upload fallback</b> always reachable, including from the locked state.' },

  { id:'f2', n:'1', scope:'now', name:'Shop address · map-first', status:'ready',
    sub:'Map-first. One pair of screens for both journeys — shop details during verification, and adding an address inside the app.',
    flows:[
      { key:'shop', label:'Shop details · verification',
        steps:[
          ['Shop Location','Map opens, pin auto-placed','screens/location-pin.html?flow=shop'],
          ['Shop details','Shop name + one address block','screens/shop-address-details.html?flow=shop&state=filled'],
          ['Shop details saved','The app’s own splash, then Home','screens/rapido-signup-success.html?from=shop'],
          ['Home · pending','Verification in progress','screens/home-pending.html']
        ]},
      { key:'address', label:'Add address · in app',
        steps:[
          ['Addresses','Saved addresses list','screens/addresses.html'],
          ['Add new address','Map + search','screens/location-pin.html?flow=address'],
          ['Address details','Type, contact, all mandatory','screens/shop-address-details.html?flow=address&type=warehouse&state=filled'],
          ['Saved','Back in your address list','screens/addresses.html']
        ]}
    ],
    states:[
      ['screens/location-pin.html?state=detecting','Locating','pin auto-placed'],
      ['screens/location-pin.html?state=located','Pin placed','drag to correct'],
      ['screens/location-pin.html?state=search','Search','area / street'],
      ['screens/location-pin.html?state=denied','Location off','search instead'],
      ['screens/shop-address-details.html?flow=shop&state=filled','Shop details','no type asked'],
      ['screens/rapido-signup-success.html?from=shop','Saved splash','existing screen, 2s'],
      ['screens/shop-address-details.html?flow=address&type=warehouse&state=filled','Add address','type + contact'],
      ['screens/rapido-shop-details.html','Typed manually','existing Shop Details form'],
      ['screens/shop-address-details.html?flow=address&type=home&state=filled','Home type','no name asked'],
      ['screens/shop-address-details.html?flow=shop&state=error','Validation','name required']
    ],
    rules:'<b>No street address?</b> No separate screen — whatever the map returns lands in the fields, and Area / City / Tehsil is editable. ' +
          '<b>pincode_map_v2</b> decides district / state / territory, not Google. ' +
          '<b>Shop journey</b> asks no address type and the shop name is mandatory; ' +
          '<b>address journey</b> asks the type, and Home asks no name at all. <b>Enter address manually</b> on every map state opens the app’s existing typed form — Shop Details in onboarding, Add Address inside the app — with its own location button removed.' },

  { id:'f3', n:'2', scope:'now', name:'Notifications inbox', status:'ready',
    sub:'One feed for orders, returns, money, KYC and requests — every row a one-tap route to the screen where the retailer can act.',
    flows:[
      { key:'inbox', label:'Inbox → act',
        steps:[
          ['Home','Bell with unread count','screens/home.html'],
          ['Inbox','Tabs, day groups, unread dots','screens/notifications.html'],
          ['Cart request','Action-required item with expiry','screens/sales-cart-request.html'],
          ['Delivered stock','Inventory prompt from delivery','screens/inventory-delivered.html']
        ]}
    ],
    states:[
      ['screens/notifications.html','Default','4 unread'],
      ['screens/notifications.html?state=loading','Loading','skeletons'],
      ['screens/notifications.html?state=empty','Empty','first-time'],
      ['screens/notifications.html?state=error','Offline','retry']
    ],
    rules:'Tapping marks read; opening the inbox does not. <b>Action-required</b> items (cart request, KYC rejected, payment failed) sort above informational ones and carry their expiry. ' +
          'Every row resolves through one <b>deep-link registry</b> — an unknown route falls back to its list screen, never a blank.' },

  { id:'f4', n:'4', scope:'later', name:'Return request', status:'ready',
    sub:'KKD-parity return and replace, plus a My Returns list so a retailer with many orders can find a request without remembering the order.',
    flows:[
      { key:'raise', label:'Raise a return',
        steps:[
          ['Orders','Return CTA on delivered orders','screens/orders.html'],
          ['Order details','T&C → reason → photos','screens/order-details.html?return=1'],
          ['My Returns','All requests in one place','screens/returns.html'],
          ['Status','Timeline to refund or replacement','screens/returns.html?state=detail']
        ]},
      { key:'outcomes', label:'Outcomes',
        steps:[
          ['Pickup scheduled','Approved, courier assigned','screens/returns.html?state=detail'],
          ['Replacement done','QC passed, delivered','screens/returns.html?state=done'],
          ['Rejected','Reason shown verbatim','screens/returns.html?state=rejected'],
          ['Refund status','KKD refund timeline','screens/order-details.html']
        ]}
    ],
    states:[
      ['screens/returns.html','My Returns','3 requests'],
      ['screens/returns.html?state=detail','In progress','pickup scheduled'],
      ['screens/returns.html?state=done','Completed','replacement delivered'],
      ['screens/returns.html?state=rejected','Rejected','reason + support'],
      ['screens/returns.html?state=empty','Empty','never returned'],
      ['screens/returns.html?state=loading','Loading','skeletons'],
      ['screens/returns.html?state=error','Error','retry']
    ],
    rules:'Only <b>delivered</b> orders, inside the return window. Quantity capped at what was delivered minus what was already returned. ' +
          'Photos mandatory for damaged / wrong / quality. <b>One open request per (order, product)</b>. ' +
          'The old <code>return-request.html</code> is superseded by this flow.' },

  { id:'f5', n:'5', scope:'later', name:'Refer & Earn', status:'ready',
    sub:'Every referral shows exactly which step it is stuck on and what the retailer can do about it — not "invite friends and earn".',
    flows:[
      { key:'refer', label:'Share → reward',
        steps:[
          ['Refer & Earn','Condition stated up front','screens/refer.html'],
          ['Pending referral','Joined, KYC pending','screens/refer.html?state=detail'],
          ['Paid','₹500 credited','screens/refer.html?state=paid'],
          ['Wallet','Reward in statement','screens/wallet.html']
        ]}
    ],
    states:[
      ['screens/refer.html','Default','progress per referral'],
      ['screens/refer.html?state=detail','Detail','what is pending'],
      ['screens/refer.html?state=paid','Rewarded','full timeline'],
      ['screens/refer.html?state=rejected','Not eligible','existing retailer'],
      ['screens/refer.html?state=empty','Empty','one strong CTA'],
      ['screens/refer.html?state=paused','Paused','program off']
    ],
    rules:'Reward is tied to a <b>delivered</b> first order of ₹2,000+, not to signup — and the screen says so. ' +
          'Statuses: invited → joined → KYC verified → first order → paid, plus expired and not-eligible. ' +
          'Amounts come from config, so Business can change them without a release. <b>Open Decision:</b> attribution when RLM already sourced that retailer.' },

  { id:'f6', n:'6', scope:'later', name:'Testimonial capture', status:'ready',
    sub:'Reviews are captured against a product in a delivered order — not a generic order rating, and not the story programme.',
    flows:[
      { key:'review', label:'Rate delivered products',
        steps:[
          ['Order delivered','Rate products CTA','screens/order-details.html'],
          ['Eligible products','Only delivered lines','screens/review-products.html'],
          ['Rate','Stars required, text optional','screens/review-products.html?state=rate'],
          ['Submitted','Moderation explained','screens/review-products.html?state=submitted']
        ]}
    ],
    states:[
      ['screens/review-products.html','Product list','rated / returned'],
      ['screens/review-products.html?state=rate','Rate','stars + text + media'],
      ['screens/review-products.html?state=error','Validation','rating required'],
      ['screens/review-products.html?state=rated','Already rated','edit re-moderates'],
      ['screens/review-products.html?state=submitted','Submitted','next product'],
      ['screens/review-products.html?state=allrated','All done','nothing left'],
      ['screens/testimonial.html','Story programme','separate, 250 coins']
    ],
    rules:'Eligibility is <b>(retailer, order, product)</b> and the order must be delivered. Returned lines cannot be rated. ' +
          'Rating mandatory, text and media optional. Everything goes through <b>moderation</b> before it reaches the PDP — agri claims carry regulatory risk.' },

  { id:'f7', n:'3', scope:'now', name:'Sales cart request', status:'ready',
    sub:'An advisor builds a cart on the phone; the retailer reviews margin and cash, then accepts into their own cart. Accepting does not place the order.',
    flows:[
      { key:'accept', label:'Receive → accept',
        steps:[
          ['Notification','Cart request, expires in 22h','screens/notifications.html'],
          ['Request','5 items with margin and profit','screens/sales-cart-request.html'],
          ['Accepted','Merge summary','screens/sales-cart-request.html?state=accepted'],
          ['Cart','Checkout as usual','screens/cart.html']
        ]},
      { key:'edge', label:'Edge cases',
        steps:[
          ['Price changed','Shown before merging','screens/sales-cart-request.html?state=changed'],
          ['Expired','Read-only, ask to resend','screens/sales-cart-request.html?state=expired'],
          ['Declined','Reason goes to advisor','screens/sales-cart-request.html?state=declined']
        ]}
    ],
    states:[
      ['screens/sales-cart-request.html','Request','margin + profit'],
      ['screens/sales-cart-request.html?state=changed','Price changed','before accepting'],
      ['screens/sales-cart-request.html?state=accepted','Merged','3 added, 1 updated, 1 out of stock'],
      ['screens/sales-cart-request.html?state=declined','Decline','reason chips'],
      ['screens/sales-cart-request.html?state=expired','Expired','resend path']
    ],
    rules:'Accepting <b>merges</b> into the existing cart and says exactly what changed — duplicates summed, out-of-stock listed, nothing silent. ' +
          'Prices are held only until expiry. <b>The RLM-side composer does not exist yet</b> — that is the larger half of this feature.' },

  { id:'f8', n:'8', scope:'later', name:'Catalog download', status:'ready',
    sub:'The artefact retailers actually use at the counter — with the price-leak problem handled instead of ignored.',
    flows:[
      { key:'download', label:'Choose → download',
        steps:[
          ['Options','Scope + which prices','screens/catalog-download.html'],
          ['Generating','Progress, cancel, slow hint','screens/catalog-download.html?state=generating'],
          ['Ready','Open / share, stamped copy','screens/catalog-download.html?state=ready'],
          ['Share-safe','MRP-only version','screens/catalog-download.html?state=mrp']
        ]}
    ],
    states:[
      ['screens/catalog-download.html','Options','scope + version'],
      ['screens/catalog-download.html?state=mrp','MRP only','safe to forward'],
      ['screens/catalog-download.html?state=locked','KYC pending','priced version locked'],
      ['screens/catalog-download.html?state=generating','Generating','progress'],
      ['screens/catalog-download.html?state=ready','Ready','open / share'],
      ['screens/catalog-download.html?state=failed','Failed','retry']
    ],
    rules:'Price visibility is decided <b>server-side</b> by the same gate as the app. A priced PDF is <b>watermarked</b> with shop name, code and date, so a forwarded copy is traceable. ' +
          'An <b>MRP-only</b> version is always offered, because retailers will forward it. <b>Open Decision:</b> printable dosage (regulatory).' },

  { id:'f9', n:'9', scope:'later', name:'Krishi AI chatbot', status:'ready',
    sub:'A tool-using assistant over verified company data. Prices, stock, orders, wallet and dosage come from APIs and approved content — never from the model.',
    flows:[
      { key:'discover', label:'Problem → product → cart',
        steps:[
          ['New chat','Greeting + suggestions','screens/ai-chatbot.html?state=empty'],
          ['Diagnosis','Crop + pest, one question max','screens/ai-chatbot.html'],
          ['Checking data','Tool call, visible','screens/ai-chatbot.html?state=tool'],
          ['PDP','Open the product','screens/pdp.html']
        ]},
      { key:'guard', label:'When it should not answer',
        steps:[
          ['No approved answer','Refuses to invent a dose','screens/ai-chatbot.html?state=noresult'],
          ['API down','Says so, deep-links Orders','screens/ai-chatbot.html?state=apifail'],
          ['Human handoff','Chat attached to the ticket','screens/ai-chatbot.html?state=escalate']
        ]}
    ],
    states:[
      ['screens/ai-chatbot.html?state=empty','New chat','suggestions'],
      ['screens/ai-chatbot.html','Recommendation','product cards + dose'],
      ['screens/ai-chatbot.html?state=tool','Tool call','checking live data'],
      ['screens/ai-chatbot.html?state=noresult','No answer','refuses to guess'],
      ['screens/ai-chatbot.html?state=apifail','API down','honest failure'],
      ['screens/ai-chatbot.html?state=escalate','Escalation','callback or ticket']
    ],
    rules:'Typed blocks: conversational text is generated, <b>product cards, data blocks and dosage are not</b>. ' +
          'No price, stock, delivery date, balance or eligibility without a matching API call in the session log. ' +
          'Returns are handed to the existing return flow — the bot never builds a parallel one.' },

  { id:'f10', n:'10', scope:'later', name:'My Farmers', status:'ready',
    sub:'A retailer’s notebook, digitised — who bought what, who owes money, who to call next. Not enterprise CRM.',
    flows:[
      { key:'farmer', label:'List → profile → follow-up',
        steps:[
          ['My Farmers','48 farmers, filters','screens/my-farmers.html'],
          ['Profile','Purchases, dues, notes','screens/farmer-profile.html'],
          ['Follow-up','Reminder with a reason','screens/farmer-profile.html?state=remind'],
          ['Record a sale','Back into Inventory','screens/inventory.html']
        ]}
    ],
    states:[
      ['screens/my-farmers.html','List','filters + stats'],
      ['screens/farmer-profile.html','Profile','history + crop'],
      ['screens/farmer-profile.html?state=due','Payment due','remind path'],
      ['screens/farmer-profile.html?state=new','New farmer','no history yet'],
      ['screens/farmer-profile.html?state=note','Add note','private to retailer'],
      ['screens/farmer-profile.html?state=edit','Edit','name + phone mandatory']
    ],
    rules:'Name and phone are the only mandatory fields; phone is the dedupe key. ' +
          'Purchase history and dues come <b>only</b> from sales the retailer recorded in Inventory — one shared customer record, two entry points. ' +
          '<b>Open Decision (Legal):</b> whether Katyayani may use this farmer data at all.' },

  { id:'f11', n:'4', scope:'now', name:'Inventory tracker', status:'ready',
    sub:'The adoption mechanic: what we delivered is offered as stock in one tap, with a ledger that explains every number.',
    flows:[
      { key:'delivered', label:'Delivered → inventory',
        steps:[
          ['Delivered','Notification after delivery','screens/notifications.html'],
          ['Add stock','Editable, unit conversion shown','screens/inventory-delivered.html'],
          ['Updated','Ledger entries written','screens/inventory-delivered.html?state=added'],
          ['Inventory','Low stock, reorder, sell','screens/inventory.html']
        ]},
      { key:'ledger', label:'Trust the number',
        steps:[
          ['Stock history','Every movement with its source','screens/inventory-delivered.html?state=history'],
          ['Already added','Cannot double-add an order','screens/inventory-delivered.html?state=already'],
          ['Expired','Manual path after the window','screens/inventory-delivered.html?state=expired']
        ]}
    ],
    states:[
      ['screens/inventory-delivered.html','Add delivered','pre-filled, editable'],
      ['screens/inventory-delivered.html?state=partial','Partial','short delivery'],
      ['screens/inventory-delivered.html?state=added','Added','what changed'],
      ['screens/inventory-delivered.html?state=history','Stock ledger','explains the count'],
      ['screens/inventory-delivered.html?state=already','Already added','idempotent'],
      ['screens/inventory-delivered.html?state=expired','Expired','manual instead'],
      ['screens/inventory.html','Inventory','low stock + sell']
    ],
    rules:'The prompt <b>comes to the retailer</b> when they open Inventory — order id shown, everything ticked by default. Delivered stock is still a <b>suggestion, never automatic</b> — a silent wrong count destroys trust in the whole feature. ' +
          'Quantities are editable, the <b>case → unit conversion is shown</b>, and an order can be added <b>once</b>. ' +
          'Current stock is derived from the ledger, so "why is this number wrong" is always answerable.' },

  { id:'f12', n:'12', scope:'later', name:'Story rail', status:'test',
    sub:'Built and in testing. No redesign — what it needs is a kill switch, expiry, seen-state persistence and analytics before release.',
    flows:[
      { key:'story', label:'Rail → viewer',
        steps:[
          ['Home','Story rail with unseen rings','screens/home.html'],
          ['Flash sale','Auto-advance, tap to skip','screens/home.html?story=flash-sale'],
          ['Quiz','Interactive story','screens/home.html?story=quiz'],
          ['Spray guide','Deep link to product','screens/home.html?story=spray-guide']
        ]}
    ],
    states:[
      ['screens/home.html','Rail','unseen rings'],
      ['screens/home.html?story=flash-sale','Viewer','progress bars'],
      ['screens/home.html?story=quiz','Quiz','answer states'],
      ['screens/home.html?story=success','Success story','social proof']
    ],
    rules:'<b>Release blockers:</b> no kill switch, content hard-coded with no expiry, seen/unseen not persisted, and any reward promised in the quiz that is not actually credited. ' +
          'Analytics must be live before release or the rail cannot be justified next cycle.' },

  { id:'f13', n:'13', scope:'later', name:'Screen share', status:'ready',
    sub:'In-app, view-only sharing with a voice call. Designed — but the SDK and the RLM console are unproven, so the copy must match what the provider actually does.',
    flows:[
      { key:'session', label:'Request → session → feedback',
        steps:[
          ['Help','Entry from support','screens/help.html'],
          ['Start','What is shared, what is hidden','screens/screen-share.html'],
          ['Live session','Advisor sees, cannot tap','screens/screen-share.html'],
          ['Ended','Duration, outcome, rating','screens/screen-share.html']
        ]}
    ],
    states:[
      ['screens/screen-share.html','Screen share','connect → session → end'],
      ['screens/help.html','Help','entry point']
    ],
    rules:'View-only, <b>no remote control</b>, ever. Sensitive screens (KYC numbers, wallet, payment) must render masked in the stream. ' +
          '<b>Feasibility first:</b> "end-to-end encrypted" and "only this app is shared" are claims that need the provider in writing — in-app view streaming makes the second one true by construction.' }
];

var CHIP = { ready:['ready','Screens ready'], test:['test','Testing'], pending:['','Not designed yet'] };
var LATER = ['', 'Not in Phase 2'];
var current = null, flowKey = null;

/* ---------- rail ---------- */
function railRow(f){
  return '<button class="frow" data-id="' + f.id + '" onclick="open_(\'' + f.id + '\')">' +
         '<span class="num">' + (f.scope === 'now' ? f.n : '·') + '</span><span>' + f.name + '</span>' +
         '<span class="dot ' + (f.scope !== 'now' ? '' : f.status === 'test' ? 'test' : 'ready') + '"></span></button>';
}
document.getElementById('rail').innerHTML =
  '<div class="rail-h" style="padding-top:4px">In Phase 2</div>' +
  FEATURES.filter(function(f){ return f.scope === 'now'; }).map(railRow).join('') +
  '<div class="rail-h" style="margin-top:8px;border-top:1px solid #1c1c1c;padding-top:12px">Moved out of Phase 2</div>' +
  FEATURES.filter(function(f){ return f.scope !== 'now'; }).map(railRow).join('');

function open_(id){
  current = FEATURES.filter(function(f){ return f.id === id; })[0];
  flowKey = current.flows ? current.flows[0].key : null;
  document.querySelectorAll('.frow').forEach(function(b){ b.classList.toggle('on', b.dataset.id === id); });
  history.replaceState(null, '', '#' + id);
  render();
}

function render(){
  var f = current, h = '';
  var c = CHIP[f.status];
  var now = f.scope === 'now';
  h += '<div class="p-head"><h2>' + (now ? f.n + ' · ' : '') + f.name + '</h2>' +
       '<span class="chip ' + c[0] + '">' + c[1] + '</span>' +
       (now ? '' : '<span class="chip">' + LATER[1] + '</span>') + '</div>';
  if (!now) {
    h += '<div style="border:1px dashed #2a2a2a;border-radius:10px;padding:11px 13px;font-size:11.5px;color:#9a9a9a;line-height:1.6;margin-bottom:14px">' +
         'Moved out of Phase 2 on 14 Sep 2026. The screens below still work and the full spec is kept in ' +
         '<a href="docs/phase-2-deferred.html" style="color:#5FBF8E;font-weight:700">Deferred features</a> — whichever phase picks this up starts from a finished spec.</div>';
  }
  h += '<p class="p-sub">' + (f.sub || 'Defined in the Phase 2 document — flow, states, business rules and acceptance criteria.') + '</p>';

  if (!f.flows) {
    h += '<div class="empty"><div class="t">No screens yet</div>' +
         '<div class="d">This feature is specified in the Phase 2 document — flow, states, business rules and acceptance criteria.<br>' +
         '<a href="docs/phase-2.html">Read the spec →</a></div></div>';
    document.getElementById('panel').innerHTML = h;
    return;
  }

  var flow = f.flows.filter(function(x){ return x.key === flowKey; })[0];
  h += '<div class="seg">' + f.flows.map(function(x){
         return '<button class="' + (x.key === flowKey ? 'on' : '') + '" onclick="setFlow(\'' + x.key + '\')">' + x.label + '</button>';
       }).join('') + '</div>';

  h += '<div class="stagewrap">' +
       '<div class="phone"><iframe id="frame" src="' + flow.steps[0][2] + '"></iframe></div>' +
       '<div><div class="steps">' +
       flow.steps.map(function(s, i){
         return '<button class="step' + (i === 0 ? ' on' : '') + '" data-src="' + s[2] + '" onclick="goStep(this)">' +
                '<span class="n">' + (i + 1) + '</span><span>' + s[0] + '<small>' + s[1] + '</small></span></button>';
       }).join('') +
       '</div><div class="tools">' +
       '<button class="tool" onclick="restart()">Restart</button>' +
       '<a class="tool" href="' + flow.steps[0][2] + '" target="_blank">Open ↗</a>' +
       '</div><div class="rules">' + (f.rules || '') + '</div></div></div>';

  if (f.states) {
    h += '<div class="states-h">Screen states · ' + f.states.length + '</div><div class="cards">' +
         f.states.map(function(s){
           return '<a href="' + s[0] + '" target="_blank"><div class="frame"><iframe src="' + s[0] + '" loading="lazy"></iframe></div>' +
                  '<div class="cap">' + s[1] + '<small>' + s[2] + '</small></div></a>';
         }).join('') + '</div>';
  }

  document.getElementById('panel').innerHTML = h;
  watchFrame();
}

function setFlow(k){ flowKey = k; render(); }

function goStep(btn){
  document.getElementById('frame').src = btn.dataset.src;
  document.querySelectorAll('.step').forEach(function(b){ b.classList.toggle('on', b === btn); });
}
function restart(){
  var first = document.querySelector('.step');
  if (first) goStep(first);
}

/* follow navigation that happens inside the frame (same origin) */
function watchFrame(){
  var frame = document.getElementById('frame');
  if (!frame) return;
  frame.addEventListener('load', function(){
    var path;
    try { path = frame.contentWindow.location.pathname + frame.contentWindow.location.search; }
    catch (e) { return; }
    var hit = null;
    document.querySelectorAll('.step').forEach(function(b){
      var file = b.dataset.src.split('?')[0].split('/').pop();
      if (!hit && path.indexOf(file) > -1) hit = b;
    });
    if (hit) document.querySelectorAll('.step').forEach(function(b){ b.classList.toggle('on', b === hit); });
  });
}

open_((location.hash || '#f2').slice(1) || 'f2');
</script>
</body>
</html>
