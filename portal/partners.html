<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Partner Explorer · Partner App PM Portal</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/portal.css">
</head>
<body>
<script src="assets/data.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/portal.js"></script>
<script>
var page = P.init({
  title: 'Partner Explorer',
  sub: 'Every partner, searchable — drill from a number on any other page down to the individual retailer behind it'
});

page.innerHTML = '<div id="tabs"></div><div id="body" style="margin-top:14px"></div>';
var TABS = ['All partners', 'Leaderboard', 'New this period', 'Verification queue', 'Never ordered'];
var tab = 0;

function render() {
  var b = document.getElementById('body');
  if (tab === 0) return renderAll(b);
  if (tab === 1) return renderBoard(b);
  if (tab === 2) return renderNew(b);
  if (tab === 3) return renderQueue(b);
  return renderNever(b);
}

function cols(extra) {
  var base = [
    { k: 'name', l: 'Partner', fmt: function (v, p) {
        return '<div style="display:flex;align-items:center;gap:8px"><div class="avatar">' + v.charAt(0) + '</div>' +
          '<div style="min-width:0"><span class="b">' + v + '</span>' +
          '<div class="mut" style="font-size:10px">' + p.shop + ' · ' + p.city + ', ' + p.state + '</div></div></div>'; } },
    { k: 'id', l: 'ID', cls: 'mut', fmt: function (v) { return '<span style="font-size:10.5px">' + v + '</span>'; } },
    { k: 'tier', l: 'Tier', fmt: function (v) { return '<span class="tier ' + v + '">' + v + '</span>'; } },
    { k: 'segmentName', l: 'Segment', fmt: function (v) { return '<span class="pill n">' + v + '</span>'; } },
    { k: 'verifyStatus', l: 'Verification', fmt: function (v) {
        return '<span class="pill ' + (v === 'Verified' ? 'g' : v === 'Pending' ? 'y' : 'r') + ' dot">' + v + '</span>'; } },
    { k: 'channelName', l: 'Acquired via', cls: 'mut', fmt: function (v) { return '<span style="font-size:10.5px">' + v + '</span>'; } },
    { k: 'orders', l: 'Orders', num: true, fmt: KO.fmtNum },
    { k: 'aov', l: 'AOV', num: true, fmt: KO.fmtCr },
    { k: 'gmv', l: 'Lifetime GMV', num: true, fmt: function (v) { return '<span class="b">' + KO.fmtCr(v) + '</span>'; } },
    { k: 'coins', l: 'Coins', num: true, cls: 'mut', fmt: KO.fmtNum },
    { k: 'sessions30', l: 'Sessions 30d', num: true, fmt: KO.fmtNum },
    { k: 'exploreTools', l: 'Tools', num: true, fmt: function (v) { return v + '/13'; } },
    { k: 'lastActiveAgo', l: 'Last seen', num: true, fmt: function (v) {
        return '<span class="pill ' + (v < 7 ? 'g' : v < 30 ? 'y' : 'r') + '">' + v + 'd</span>'; } },
    { k: 'churnRisk', l: 'Churn risk', num: true, fmt: function (v) {
        return '<div style="display:flex;align-items:center;gap:7px;justify-content:flex-end"><div class="meter" style="width:38px"><i style="width:' + (v * 100).toFixed(0) + '%;background:' + (v > .6 ? '#E23744' : v > .35 ? '#D4A537' : '#0E7A4E') + '"></i></div>' + Math.round(v * 100) + '%</div>'; } }
  ];
  return extra ? base.concat(extra) : base;
}

var EXPORT_COLS = [
  { k: 'id', l: 'Partner ID' }, { k: 'name', l: 'Name' }, { k: 'shop', l: 'Shop' },
  { k: 'city', l: 'City' }, { k: 'stateName', l: 'State' }, { k: 'tier', l: 'Tier' },
  { k: 'segmentName', l: 'Segment' }, { k: 'verifyStatus', l: 'Verification' },
  { k: 'channelName', l: 'Acquisition channel' }, { k: 'joined', l: 'Joined' },
  { k: 'lastActive', l: 'Last active' }, { k: 'orders', l: 'Orders' },
  { k: 'aov', l: 'AOV' }, { k: 'gmv', l: 'Lifetime GMV' }, { k: 'ltv', l: 'Est. LTV' },
  { k: 'coins', l: 'Coins' }, { k: 'creditLimit', l: 'Credit limit' },
  { k: 'sessions30', l: 'Sessions 30d' }, { k: 'pdpViews30', l: 'PDP views 30d' },
  { k: 'exploreTools', l: 'Explore tools used' }, { k: 'farmers', l: 'Farmers tagged' },
  { k: 'version', l: 'App version' },
  { k: 'churnRisk', l: 'Churn risk', raw: function (p) { return Math.round(p.churnRisk * 100); } }
];

/* ===================== ALL PARTNERS ===================== */
function renderAll(b) {
  var pp = P.partners();
  b.innerHTML =
    '<div class="grid g6" id="kpis"></div>' +
    '<div style="margin-top:12px">' +
      P.card('Partner directory', 'Sample of ' + KO.fmtNum(pp.length) + ' partners, projected from the ' + KO.fmtK(KO.BASE.verifiedBase) +
        ' verified base. Click any row for the full profile and event timeline.', 'tbl',
        '<div class="search-wrap">' + P.ico('search', '#9E9E9E', 13) +
        '<input class="inp" id="q" placeholder="Name, shop, city or ID…" style="width:230px"></div>') +
    '</div>' +
    '<div class="grid g3" style="margin-top:12px">' +
      P.card('GMV distribution', 'A long tail with a very heavy head', 'dGmv') +
      P.card('Acquisition channel mix', 'Of the sampled partners', 'dCh') +
      P.card('App version spread', 'Old versions carry worse conversion and more crashes', 'dVer') +
    '</div>';

  var verified = pp.filter(function (p) { return p.verified; });
  var ordered = pp.filter(function (p) { return p.orders > 0; });
  P.kpiRow('kpis', [
    { lab: 'Partners in sample', val: KO.fmtNum(pp.length), hero: true, icon: 'user',
      hint: P.isFiltered() ? 'filtered' : 'full sample' },
    { lab: 'Verified', val: KO.fmtPct(verified.length / (pp.length || 1)), icon: 'check',
      hint: pp.filter(function (p) { return p.verifyStatus === 'Pending'; }).length + ' pending, ' +
            pp.filter(function (p) { return p.verifyStatus === 'Rejected'; }).length + ' rejected' },
    { lab: 'Have ordered', val: KO.fmtPct(ordered.length / (pp.length || 1)), icon: 'cart',
      badge: '<span class="pill ' + (ordered.length / pp.length > .7 ? 'g' : 'y') + '">' + ordered.length + ' partners</span>' },
    { lab: 'Median lifetime GMV', val: KO.fmtCr(median(pp.map(function (p) { return p.gmv; }))), icon: 'coin',
      hint: 'mean is ' + KO.fmtCr(pp.reduce(function (a, p) { return a + p.gmv; }, 0) / (pp.length || 1)) },
    { lab: 'Active in last 7 days', val: KO.fmtPct(pp.filter(function (p) { return p.lastActiveAgo < 7; }).length / (pp.length || 1)), icon: 'pulse' },
    { lab: 'High churn risk', val: pp.filter(function (p) { return p.churnRisk > .6; }).length, gold: true, icon: 'alert',
      hint: KO.fmtCr(pp.filter(function (p) { return p.churnRisk > .6; }).reduce(function (a, p) { return a + p.gmv; }, 0)) + ' exposed' }
  ], 'g6');

  var t = P.table('tbl', {
    rows: pp, sort: 'gmv', pageSize: 15, searchKeys: ['name', 'shop', 'city', 'id', 'stateName', 'segmentName'],
    cols: cols(), onRow: openPartner
  });
  document.getElementById('q').addEventListener('input', function () { t.search(this.value); });

  var bands = [['₹0', 0, 1], ['under ₹50k', 1, 50000], ['₹50k–2L', 50000, 200000], ['₹2L–5L', 200000, 500000],
               ['₹5L–10L', 500000, 1000000], ['₹10L+', 1000000, 1e12]];
  KC.bars(document.getElementById('dGmv'), {
    height: 240, labels: bands.map(function (x) { return x[0]; }), yFmt: KO.fmtNum,
    series: [{ name: 'Partners', color: '#0E7A4E',
      data: bands.map(function (x) { return pp.filter(function (p) { return p.gmv >= x[1] && p.gmv < x[2]; }).length; }) }]
  });
  KC.donut(document.getElementById('dCh'), {
    data: KO.CHANNELS.map(function (c) {
      return { label: c.name, value: pp.filter(function (p) { return p.channel === c.id; }).length, color: c.color };
    }).filter(function (x) { return x.value > 0; }),
    center: { t: KO.fmtNum(pp.length), s: 'partners' }, fmt: KO.fmtNum, size: 160
  });
  KC.hbars(document.getElementById('dVer'), {
    fmt: KO.fmtNum,
    rows: KO.VERSIONS.map(function (v) {
      return { label: 'v' + v.id, value: pp.filter(function (p) { return p.version === v.id; }).length,
               sub: v.label + ' · ' + v.crashFree + '% crash-free',
               color: v.crashFree > 99.5 ? '#0E7A4E' : v.crashFree > 99 ? '#D4A537' : '#E23744' };
    })
  });

  P.setExport(function () { P.csv('partner-directory', EXPORT_COLS, t.data()); });
}
function median(a) {
  if (!a.length) return 0;
  var s = a.slice().sort(function (x, y) { return x - y; });
  var m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

/* ===================== LEADERBOARD ===================== */
function renderBoard(b) {
  var pp = P.partners();
  b.innerHTML =
    '<div class="note" style="margin-bottom:12px">' + P.ico('info', '#606060', 12) +
      ' This is the data behind <code>leaderboard.html</code> in the app. Ranks are State and National only — never district, ' +
      'so a rank tile reads "#3 in MP", not "#3 in Indore".</div>' +
    '<div class="grid g2">' +
      P.card('National top 20', 'By lifetime GMV', 'lbNat') +
      P.card('State leaders', 'The top partner in every state', 'lbState') +
    '</div>' +
    '<div class="grid g3" style="margin-top:12px">' +
      P.card('Top by order count', 'Frequency, not size', 'lbFreq') +
      P.card('Top by coins earned', 'Most engaged with the loyalty programme', 'lbCoins') +
      P.card('Top by farmers tagged', 'Deepest farmer relationships', 'lbFarm') +
    '</div>';

  function board(host, rows, valFmt, valKey, subFn) {
    document.getElementById(host).innerHTML = '<div class="stat-l">' +
      rows.map(function (p, i) {
        return '<div class="stat-r" style="padding:6px 0;border-bottom:1px solid #F4F4F4;cursor:pointer" data-id="' + p.id + '">' +
          '<span class="rank' + (i < 3 ? ' t1' : '') + '">' + (i + 1) + '</span>' +
          '<div class="avatar" style="width:24px;height:24px;font-size:9.5px;flex:0 0 24px">' + p.name.charAt(0) + '</div>' +
          '<span class="nm">' + p.name + ' <span style="color:#9E9E9E;font-weight:500">· ' + (subFn ? subFn(p) : p.city) + '</span></span>' +
          '<span class="tier ' + p.tier + '">' + p.tier + '</span>' +
          '<span class="vl">' + valFmt(p[valKey]) + '</span></div>';
      }).join('') + '</div>';
    Array.prototype.forEach.call(document.querySelectorAll('#' + host + ' [data-id]'), function (el) {
      el.addEventListener('click', function () {
        openPartner(pp.filter(function (p) { return p.id === el.dataset.id; })[0]);
      });
    });
  }

  board('lbNat', pp.slice().sort(function (a, x) { return x.gmv - a.gmv; }).slice(0, 20), KO.fmtCr, 'gmv',
    function (p) { return p.city + ', ' + p.state; });

  var leaders = KO.STATES.map(function (s) {
    var g = pp.filter(function (p) { return p.state === s.id; }).sort(function (a, x) { return x.gmv - a.gmv; });
    return g[0] ? Object.assign({}, g[0], { stateLabel: s.name }) : null;
  }).filter(Boolean).sort(function (a, x) { return x.gmv - a.gmv; });
  board('lbState', leaders, KO.fmtCr, 'gmv', function (p) { return p.stateLabel; });

  board('lbFreq', pp.slice().sort(function (a, x) { return x.orders - a.orders; }).slice(0, 10), KO.fmtNum, 'orders');
  board('lbCoins', pp.slice().sort(function (a, x) { return x.coins - a.coins; }).slice(0, 10), KO.fmtNum, 'coins');
  board('lbFarm', pp.slice().sort(function (a, x) { return x.farmers - a.farmers; }).slice(0, 10), KO.fmtNum, 'farmers');

  P.setExport(function () {
    P.csv('leaderboard', EXPORT_COLS, pp.slice().sort(function (a, x) { return x.gmv - a.gmv; }).slice(0, 100));
  });
}

/* ===================== NEW THIS PERIOD ===================== */
function renderNew(b) {
  var pp = P.partners().filter(function (p) { return p.joinedAgo <= P.range(); });
  b.innerHTML =
    '<div class="grid g5" id="nKpi"></div>' +
    '<div style="margin-top:12px">' +
      P.card('Joined in the last ' + P.range() + ' days', 'The cohort you are currently activating', 'nTbl',
        '<div class="search-wrap">' + P.ico('search', '#9E9E9E', 13) + '<input class="inp" id="nq" placeholder="Search…" style="width:180px"></div>') +
    '</div>' +
    '<div class="grid g3" style="margin-top:12px">' +
      P.card('Acquisition channel', 'Where this cohort came from', 'nCh') +
      P.card('Activation status', 'Have they ordered yet?', 'nAct') +
      P.card('Days to first order', 'For those who have ordered', 'nTime') +
    '</div>';

  var activated = pp.filter(function (p) { return p.orders > 0; });
  P.kpiRow('nKpi', [
    { lab: 'New partners', val: KO.fmtNum(pp.length), hero: true, icon: 'user',
      hint: 'in the sample, last ' + P.range() + ' days' },
    { lab: 'Verified', val: KO.fmtPct(pp.filter(function (p) { return p.verified; }).length / (pp.length || 1)), icon: 'check' },
    { lab: 'Activated (ordered)', val: KO.fmtPct(activated.length / (pp.length || 1)), icon: 'cart',
      badge: '<span class="pill ' + (activated.length / (pp.length || 1) > .5 ? 'g' : 'y') + '">' + activated.length + ' of ' + pp.length + '</span>' },
    { lab: 'Avg first-order value', val: KO.fmtCr(activated.length ? activated.reduce(function (a, p) { return a + p.aov; }, 0) / activated.length : 0), icon: 'coin' },
    { lab: 'Still not verified', val: pp.filter(function (p) { return !p.verified; }).length, gold: true, icon: 'alert',
      hint: 'blocked from pricing and ordering' }
  ], 'g5');

  var t = P.table('nTbl', {
    rows: pp, sort: 'joinedAgo', dir: 1, pageSize: 15, searchKeys: ['name', 'shop', 'city', 'id'],
    cols: cols([{ k: 'joinedAgo', l: 'Joined', num: true, fmt: function (v, p) {
      return '<span class="b">' + v + 'd ago</span><div class="mut" style="font-size:10px">' + KO.fmtDate(p.joined) + '</div>'; } }]),
    onRow: openPartner
  });
  document.getElementById('nq').addEventListener('input', function () { t.search(this.value); });

  KC.donut(document.getElementById('nCh'), {
    data: KO.CHANNELS.map(function (c) {
      return { label: c.name, value: pp.filter(function (p) { return p.channel === c.id; }).length, color: c.color };
    }).filter(function (x) { return x.value > 0; }),
    center: { t: KO.fmtNum(pp.length), s: 'new' }, fmt: KO.fmtNum, size: 160
  });
  KC.donut(document.getElementById('nAct'), {
    data: [
      { label: 'Ordered', value: activated.length, color: '#0E7A4E' },
      { label: 'Verified, no order', value: pp.filter(function (p) { return p.verified && p.orders === 0; }).length, color: '#D4A537' },
      { label: 'Not verified', value: pp.filter(function (p) { return !p.verified; }).length, color: '#E23744' }
    ], center: { t: KO.fmtPct(activated.length / (pp.length || 1), 0), s: 'activated' }, fmt: KO.fmtNum, size: 160
  });
  KC.bars(document.getElementById('nTime'), {
    height: 240, labels: ['same day', '1–3d', '4–7d', '8–14d', '15–30d', '30d+'], yFmt: KO.fmtNum,
    series: [{ name: 'Partners', color: '#0E7A4E',
      data: [.184, .246, .188, .162, .142, .078].map(function (x) { return Math.round(activated.length * x); }) }]
  });
  document.getElementById('nTime').insertAdjacentHTML('beforeend',
    '<div class="note" style="margin-top:10px">' + KO.fmtPct(.184 + .246) +
    ' of activated partners order within 3 days of verification. After 14 days the odds collapse — that is the window the onboarding drip has to work in.</div>');

  P.setExport(function () { P.csv('new-partners', EXPORT_COLS, t.data()); });
}

/* ===================== VERIFICATION QUEUE ===================== */
function renderQueue(b) {
  var pp = P.partners().filter(function (p) { return !p.verified; });
  var pending = pp.filter(function (p) { return p.verifyStatus === 'Pending'; });
  var rejected = pp.filter(function (p) { return p.verifyStatus === 'Rejected'; });
  b.innerHTML =
    '<div class="grid g5" id="qKpi"></div>' +
    '<div class="ins ' + (KO.verifyOps.slaBreach > 50 ? 'crit' : 'warn') + '" style="margin-top:12px">' +
      '<div class="ic">' + P.ico('clock', '#E23744', 15) + '</div>' +
      '<div><h4>' + KO.fmtNum(KO.verifyOps.pendingNow) + ' documents in the ops queue · ' + KO.verifyOps.slaBreach + ' past the 48h SLA</h4>' +
      '<p>Median TAT is ' + KO.verifyOps.medianHours + 'h against an 8h target. Every partner below is a retailer who has done their part ' +
      'and is now looking at a locked Home screen. See <a class="lk" href="funnel.html">Register → Verify</a> for the ops detail and the auto-approve plan.</p></div></div>' +
    '<div style="margin-top:12px">' +
      P.card('Partners awaiting or failing verification', 'Pending first, then rejected — the rejected list is a re-submission opportunity, not a dead end', 'qTbl',
        '<div class="seg" id="qSeg"><button data-s="all" class="on">All</button><button data-s="Pending">Pending</button><button data-s="Rejected">Rejected</button></div>') +
    '</div>' +
    '<div class="grid g3" style="margin-top:12px">' +
      P.card('Queue age', 'Right now', 'qAge') +
      P.card('Rejection reasons', 'Last 90 days', 'qRej') +
      P.card('Recovery after rejection', 'Do rejected partners come back?', 'qRec') +
    '</div>';

  P.kpiRow('qKpi', [
    { lab: 'In queue (ops)', val: KO.fmtNum(KO.verifyOps.pendingNow), hero: true, icon: 'clock',
      hint: (KO.verifyOps.pendingNow / (KO.sum(P.rows(), 'docsSubmit') / P.range())).toFixed(1) + ' days of backlog' },
    { lab: 'SLA breached', val: KO.verifyOps.slaBreach, icon: 'alert',
      badge: '<span class="pill r">' + KO.fmtPct(KO.verifyOps.slaBreach / KO.verifyOps.pendingNow) + '</span>' },
    { lab: 'Pending in sample', val: pending.length, icon: 'user' },
    { lab: 'Rejected in sample', val: rejected.length, icon: 'down',
      hint: 'each one is a re-submission opportunity' },
    { lab: 'Median TAT', val: KO.verifyOps.medianHours + 'h', gold: true, icon: 'clock',
      badge: '<span class="pill y">target 8h</span>' }
  ], 'g5');

  var f = 'all';
  var t;
  function draw() {
    t = P.table('qTbl', {
      rows: f === 'all' ? pp : pp.filter(function (p) { return p.verifyStatus === f; }),
      sort: 'joinedAgo', dir: -1, pageSize: 12, searchKeys: ['name', 'shop', 'city', 'id'],
      cols: [
        { k: 'name', l: 'Partner', fmt: function (v, p) {
            return '<div style="display:flex;align-items:center;gap:8px"><div class="avatar">' + v.charAt(0) + '</div>' +
              '<div><span class="b">' + v + '</span><div class="mut" style="font-size:10px">' + p.shop + ' · ' + p.city + ', ' + p.state + '</div></div></div>'; } },
        { k: 'id', l: 'ID', cls: 'mut' },
        { k: 'verifyStatus', l: 'Status', fmt: function (v) {
            return '<span class="pill ' + (v === 'Pending' ? 'y' : 'r') + ' dot">' + v + '</span>'; } },
        { k: 'channelName', l: 'Acquired via', cls: 'mut' },
        { k: 'joinedAgo', l: 'Waiting', num: true, fmt: function (v) {
            return '<span class="pill ' + (v > 7 ? 'r' : v > 2 ? 'y' : 'g') + '">' + v + 'd</span>'; } },
        { k: 'pdpViews30', l: 'PDP views 30d', num: true, fmt: function (v) {
            return v > 40 ? '<span class="b" style="color:#0C831F">' + KO.fmtNum(v) + '</span>' : KO.fmtNum(v); } },
        { k: 'sessions30', l: 'Sessions 30d', num: true, fmt: KO.fmtNum },
        { k: 'intent', l: 'Intent signal', sortVal: function (p) { return p.pdpViews30; }, fmt: function (v, p) {
            return p.pdpViews30 > 60 ? '<span class="pill g">high — prioritise</span>' :
                   p.pdpViews30 > 20 ? '<span class="pill y">medium</span>' : '<span class="pill n">low</span>'; } }
      ],
      onRow: openPartner
    });
    P.setExport(function () { P.csv('verification-queue', EXPORT_COLS, t.data()); });
  }
  draw();
  document.getElementById('qSeg').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-s]'); if (!btn) return;
    f = btn.dataset.s;
    Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle('on', c === btn); });
    draw();
  });

  KC.hbars(document.getElementById('qAge'), {
    fmt: KO.fmtNum,
    rows: KO.verifyOps.queue.map(function (q) {
      return { label: q.bucket, value: q.n, sub: KO.fmtPct(q.n / KO.verifyOps.pendingNow, 0),
               color: q.bucket.indexOf('>') === 0 ? '#E23744' : q.bucket.indexOf('24') === 0 ? '#E08A1E' : '#0E7A4E' };
    })
  });
  KC.hbars(document.getElementById('qRej'), {
    rank: true, fmt: KO.fmtNum,
    rows: KO.kycRejects.slice(0, 6).map(function (x) {
      return { label: x.reason, value: x.n, sub: KO.fmtPct(x.pct, 0), color: '#E23744' };
    })
  });
  var steps = [
    { step: 'Rejected', value: 1350, where: 'ops decision' },
    { step: 'Opened the app again', value: 1012, where: 'push notification sent' },
    { step: 'Re-uploaded a document', value: 618, where: 'rapido-documents.html' },
    { step: 'Re-submitted', value: 542, where: '' },
    { step: 'Approved on retry', value: 448, where: '' }
  ];
  var top = steps[0].value;
  steps.forEach(function (s, i) {
    s.pctTop = s.value / top;
    s.pctPrevStep = i === 0 ? 1 : s.value / steps[i - 1].value;
    s.dropped = i === 0 ? 0 : steps[i - 1].value - s.value;
  });
  document.getElementById('qRec').innerHTML = '<div id="qRecFn"></div>' +
    '<div class="note" style="margin-top:10px">Only <b>' + KO.fmtPct(448 / 1350) + '</b> of rejected partners ever get approved. ' +
    'The gap is between "opened the app" and "re-uploaded" — the rejection push tells them they failed but not <i>specifically</i> what to fix. ' +
    'Naming the exact problem in the notification is a one-line change worth roughly ' +
    KO.fmtCr((1012 - 618) * .5 * .48 * KO.avg(P.rows(), 'aov')) + ' of first-order GMV.</div>';
  KC.funnel(document.getElementById('qRecFn'), steps, { autoSelect: false });
}

/* ===================== NEVER ORDERED ===================== */
function renderNever(b) {
  var pp = P.partners().filter(function (p) { return p.verified && p.orders === 0; });
  b.innerHTML =
    '<div class="grid g5" id="vKpi"></div>' +
    '<div class="ins warn" style="margin-top:12px"><div class="ic">' + P.ico('alert', '#E08A1E', 15) + '</div>' +
      '<div><h4>' + pp.length + ' verified partners have never placed an order</h4>' +
      '<p>They passed verification, they open the app, they look at products — and they never add to cart. ' +
      'Average ' + Math.round(pp.reduce(function (a, p) { return a + p.pdpViews30; }, 0) / (pp.length || 1)) +
      ' PDP views in 30 days with zero add-to-carts. This is not an awareness problem or an onboarding problem; ' +
      'it is a <b>price and margin credibility</b> problem, and it is the clearest use case for the margin-first PDP variant.</p>' +
      '<div class="mt"><span>Segment: Window Shoppers</span><span>Projected base: ' + KO.fmtK(Math.round(KO.BASE.verifiedBase * .098)) + '</span></div></div></div>' +
    '<div style="margin-top:12px">' +
      P.card('Verified but never ordered', 'Sorted by PDP views — the ones at the top want to buy', 'vTbl',
        '<div class="search-wrap">' + P.ico('search', '#9E9E9E', 13) + '<input class="inp" id="vq" placeholder="Search…" style="width:180px"></div>') +
    '</div>' +
    '<div class="grid g3" style="margin-top:12px">' +
      P.card('By acquisition channel', 'Which channels send lookers', 'vCh') +
      P.card('By state', '', 'vState') +
      P.card('What to try', 'Ranked', 'vPlays') +
    '</div>';

  P.kpiRow('vKpi', [
    { lab: 'Never ordered', val: pp.length, hero: true, icon: 'down',
      hint: KO.fmtPct(pp.length / Math.max(1, P.partners().filter(function (p) { return p.verified; }).length)) + ' of verified partners' },
    { lab: 'Avg PDP views (30d)', val: Math.round(pp.reduce(function (a, p) { return a + p.pdpViews30; }, 0) / (pp.length || 1)), icon: 'search',
      hint: 'they are definitely looking' },
    { lab: 'Avg sessions (30d)', val: Math.round(pp.reduce(function (a, p) { return a + p.sessions30; }, 0) / (pp.length || 1)), icon: 'pulse' },
    { lab: 'Still active (<14d)', val: pp.filter(function (p) { return p.lastActiveAgo < 14; }).length, icon: 'check', gold: true,
      hint: 'these are reachable right now' },
    { lab: 'Projected base', val: KO.fmtK(Math.round(KO.BASE.verifiedBase * .098)), icon: 'user',
      hint: 'worth ' + KO.fmtCr(KO.BASE.verifiedBase * .098 * .02 * KO.avg(P.rows(), 'aov')) + ' at a 2pp conversion' }
  ], 'g5');

  var t = P.table('vTbl', {
    rows: pp, sort: 'pdpViews30', pageSize: 12, searchKeys: ['name', 'shop', 'city', 'id'],
    cols: [
      { k: 'name', l: 'Partner', fmt: function (v, p) {
          return '<div style="display:flex;align-items:center;gap:8px"><div class="avatar">' + v.charAt(0) + '</div>' +
            '<div><span class="b">' + v + '</span><div class="mut" style="font-size:10px">' + p.shop + ' · ' + p.city + ', ' + p.state + '</div></div></div>'; } },
      { k: 'tier', l: 'Tier', fmt: function (v) { return '<span class="tier ' + v + '">' + v + '</span>'; } },
      { k: 'channelName', l: 'Acquired via', cls: 'mut' },
      { k: 'joinedAgo', l: 'Verified', num: true, fmt: function (v) { return v + 'd ago'; } },
      { k: 'pdpViews30', l: 'PDP views 30d', num: true, fmt: function (v) {
          return '<div style="display:flex;align-items:center;gap:7px;justify-content:flex-end"><div class="meter" style="width:38px"><i style="width:' + Math.min(100, v / 240 * 100).toFixed(0) + '%;background:#D4A537"></i></div><span class="b">' + v + '</span></div>'; } },
      { k: 'sessions30', l: 'Sessions 30d', num: true, fmt: KO.fmtNum },
      { k: 'lastActiveAgo', l: 'Last seen', num: true, fmt: function (v) {
          return '<span class="pill ' + (v < 7 ? 'g' : v < 30 ? 'y' : 'r') + '">' + v + 'd</span>'; } },
      { k: 'act', l: 'Reachable?', sortVal: function (p) { return -p.lastActiveAgo; }, fmt: function (v, p) {
          return p.lastActiveAgo < 14 && p.pdpViews30 > 40 ? '<span class="pill g">yes — high intent</span>' :
                 p.lastActiveAgo < 30 ? '<span class="pill y">yes</span>' : '<span class="pill r">gone cold</span>'; } }
    ],
    onRow: openPartner
  });
  document.getElementById('vq').addEventListener('input', function () { t.search(this.value); });

  KC.hbars(document.getElementById('vCh'), {
    rank: true, fmt: KO.fmtNum,
    rows: KO.CHANNELS.map(function (c) {
      return { label: c.name, value: pp.filter(function (p) { return p.channel === c.id; }).length, color: c.color };
    }).filter(function (x) { return x.value > 0; }).sort(function (a, x) { return x.value - a.value; })
  });
  KC.hbars(document.getElementById('vState'), {
    rank: true, fmt: KO.fmtNum,
    rows: KO.STATES.map(function (s) {
      return { label: s.name, value: pp.filter(function (p) { return p.state === s.id; }).length, color: '#0E7A4E' };
    }).filter(function (x) { return x.value > 0; }).sort(function (a, x) { return x.value - a.value; })
  });
  document.getElementById('vPlays').innerHTML = '<div class="stat-l">' +
    [['Margin-first PDP variant', 'Show rupees earned per case above the price, not a percentage below it. The A/B on % vs ₹ already showed +21% on ATC.'],
     ['₹500 off the first case', 'Direct, unambiguous, and cheap relative to a ' + KO.fmtCr(KO.avg(P.rows(), 'aov')) + ' AOV.'],
     ['Price Match reassurance push', 'The stated objection is "my distributor is cheaper". Answer it before they ask.'],
     ['ASM call for Gold-potential shops', 'A shop with 200 PDP views and no order has a specific reason. Ask them.'],
     ['Show the distributor unlock maths', 'Many of these partners do not realise the price they are looking at is not the best price available.'],
     ['Lower the free-delivery threshold for first orders', 'Removes the one objection that has nothing to do with the product.']
    ].map(function (x, i) {
      return '<div style="display:flex;gap:9px"><span class="rank' + (i === 0 ? ' t1' : '') + '">' + (i + 1) + '</span>' +
        '<div><div style="font-size:11.5px;font-weight:600;line-height:1.4">' + x[0] + '</div>' +
        '<div class="mut" style="font-size:10px;margin-top:2px;line-height:1.55">' + x[1] + '</div></div></div>';
    }).join('') + '</div>';

  P.setExport(function () { P.csv('never-ordered', EXPORT_COLS, t.data()); });
}

/* ===================== PARTNER DRAWER ===================== */
function openPartner(p) {
  if (!p) return;
  var ev = KO.partnerTimeline(p);
  var ICO = { install: 'dl', signup: 'user', profile: 'user', doc: 'flag', verified: 'check',
              order: 'cart', tool: 'compass', session: 'clock', risk: 'alert' };
  var COL = { verified: '#0C831F', order: '#0E7A4E', risk: '#E23744', tool: '#2563EB' };
  var seg = KO.SEGMENTS.filter(function (s) { return s.id === p.segment; })[0];
  var ver = KO.VERSIONS.filter(function (v) { return v.id === p.version; })[0];
  P.drawer(
    '<div style="display:flex;align-items:center;gap:10px;min-width:0">' +
      '<div class="avatar" style="width:38px;height:38px;font-size:14px;flex:0 0 38px">' + p.name.charAt(0) + '</div>' +
      '<div style="min-width:0"><div style="font-size:15px;font-weight:700;letter-spacing:-.02em">' + p.name + '</div>' +
      '<div class="mut" style="font-size:11px">' + p.shop + ' · ' + p.city + ', ' + p.stateName + '</div></div></div>',
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">' +
      '<span class="tier ' + p.tier + '">' + p.tier + '</span>' +
      '<span class="pill n">' + p.segmentName + '</span>' +
      '<span class="pill ' + (p.verified ? 'g' : p.verifyStatus === 'Pending' ? 'y' : 'r') + ' dot">' + p.verifyStatus + '</span>' +
      '<span class="pill b">' + p.channelName + '</span>' +
      '<span class="pill ' + (ver && ver.crashFree > 99.5 ? 'g' : 'y') + '">v' + p.version + '</span>' +
      '<span class="pill ' + (p.churnRisk > .6 ? 'r' : p.churnRisk > .35 ? 'y' : 'g') + '">churn ' + Math.round(p.churnRisk * 100) + '%</span>' +
    '</div>' +
    '<div class="grid g2" style="gap:10px">' +
      tile('Lifetime GMV', KO.fmtCr(p.gmv), p.orders + ' orders') +
      tile('AOV', KO.fmtCr(p.aov), 'tier + state index') +
      tile('Est. LTV', KO.fmtCr(p.ltv), 'modelled 24-month') +
      tile('Sessions (30d)', p.sessions30, p.pdpViews30 + ' PDP views') +
      tile('Coins balance', KO.fmtNum(p.coins), '1 coin = ₹1') +
      tile('Credit limit', p.creditLimit ? KO.fmtCr(p.creditLimit) : 'None', p.creditLimit ? 'approved' : 'not eligible') +
      tile('Farmers tagged', p.farmers, 'My Farmers') +
      tile('Explore tools', p.exploreTools + ' / 13', 'of the hub') +
      tile('Returns', p.returns, p.returns > 2 ? 'above average' : 'normal') +
      tile('In-app rating', p.nps + '/10', p.nps >= 9 ? 'promoter' : p.nps >= 7 ? 'passive' : 'detractor') +
    '</div>' +
    (seg ? '<div class="divd"></div><div class="ins ' + (p.churnRisk > .6 ? 'crit' : 'info') + '">' +
      '<div class="ic">' + P.ico('bulb', p.churnRisk > .6 ? '#E23744' : '#2563EB', 15) + '</div>' +
      '<div><h4>Recommended play — ' + seg.name + '</h4><p>' + seg.action + '</p>' +
      '<div class="mt"><span>' + seg.desc + '</span></div></div></div>' : '') +
    '<div class="divd"></div>' +
    '<div style="font-size:10px;font-weight:700;color:#9E9E9E;text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px">Event timeline</div>' +
    ev.map(function (x) {
      return '<div class="jrn-i"><div class="dt">' + P.ico(ICO[x.k] || 'info', COL[x.k] || '#9E9E9E', 12) + '</div>' +
        '<div class="bd"><div class="t1">' + x.l + '</div><div class="t2">' + x.d + ' · ' + KO.fmtDate(x.t) + '</div></div></div>';
    }).join('') +
    '<div class="divd"></div>' +
    '<div class="note">Joined ' + KO.fmtDate(p.joined) + ' (' + p.joinedAgo + ' days ago) · last seen ' + p.lastActiveAgo +
    ' days ago · attributed to <b>' + p.channelName + '</b> by Linkrunner.</div>'
  );
}
function tile(l, v, s) {
  return '<div style="border:1px solid #EDEDED;border-radius:10px;padding:10px">' +
    '<div style="font-size:10px;color:#606060;font-weight:600">' + l + '</div>' +
    '<div style="font-size:18px;font-weight:800;letter-spacing:-.03em;margin-top:2px">' + v + '</div>' +
    '<div class="mut" style="font-size:10px;margin-top:2px">' + s + '</div></div>';
}

P.tabs('tabs', TABS, function (i) { tab = i; render(); });
P.onChange(render);

if (location.hash) {
  var want = location.hash.slice(1);
  var m = KO.partners.filter(function (p) { return p.id === want; })[0];
  if (m) setTimeout(function () { openPartner(m); }, 120);
}
</script>
</body>
</html>
